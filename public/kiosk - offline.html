<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កន្លែងចុចយកលេខរៀង - Kiosk Queue</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap');

    /* Import Font Khmer Viravuth តាមរយៈ Google Fonts / Local */
    @import url('https://fonts.googleapis.com/css2?family=Khmer&display=swap');

    @font-face {
      font-family: 'Khmer OS Muol Li';
      src: local('Khmer OS Muol Light'), local('Khmer OS Muol');
    }

    @font-face {
      font-family: 'Khmer Viravuth';
      src: local('Khmer Viravuth'), local('KhmerViravuth');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Kantumruy Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 📱 ផ្ទាំង Main Display លើ Screen Touch Screen */
    .kiosk-card {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* ផ្នែកទី១៖ ឈ្មោះមន្ទីរពេទ្យ */
    .hospital-name {
      font-family: 'Khmer OS Muol Li', sans-serif;
      font-size: 26px;
      color: #38bdf8;
      margin-bottom: 10px;
      line-height: 1.5;
      font-weight: normal;
    }

    /* ផ្នែកទី២៖ ចំណងជើងណែនាំ */
    .kiosk-title {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-weight: 500;
    }

    /* 🔲 Grid ប្លង់ប៊ូតុងចែកជា ៤ ផ្នែក */
    .dept-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* ផ្នែកទី៣៖ ប៊ូតុងជ្រើសរើស (ប្រើ Font Khmer Viravuth) */
    .btn-dept {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #f8fafc;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 20px 15px;
      font-size: 22px;
      font-weight: normal;
      font-family: 'Khmer Viravuth', 'Kantumruy Pro', serif, sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 125px;
      line-height: 1.3;
    }

    .btn-dept:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-2px);
    }

    .btn-dept:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.6);
    }

    .btn-subtext {
      font-size: 13px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-weight: 400;
      color: #e2e8f0;
      opacity: 0.9;
    }

    /* 🖨️ ផ្នែកទម្រង់សម្រាប់ ព្រីនសំបុត្រ (Receipt Layout) */
    #print-section {
      display: none;
    }

    /* ⚙️ CSS សំរាប់កំណត់ទម្រង់កៀកគែមលើ ពេលបញ្ជា Print (កែសម្រួលដកភាពដិត) */
    @media print {
      @page {
        size: 80mm auto;
        margin: 0 !important; /* លុប Margin ក្រដាសចេញទាំងស្រុង */
      }
      
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff;
        width: 100%;
      }

      body * {
        visibility: hidden;
      }

      #print-section, #print-section * {
        visibility: visible;
      }

      #print-section {
        display: block !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        color: #000000;
        background: #ffffff;
        padding: 6px 6px 10px 6px !important;
        font-family: 'Kantumruy Pro', sans-serif;
        text-align: center;
        border: 1px solid #000000;
        border-radius: 0;
        box-sizing: border-box;
      }
      
      /* ផ្នែកទី១៖ ឈ្មោះមន្ទីរពេទ្យ & ចំណងជើង */
      .ticket-header {
        font-size: 22px;
        font-weight: 500;
        font-family: 'Khmer OS Muol Li', sans-serif;
        margin-top: 0;
        margin-bottom: 2px;
        line-height: 1.2;
      }
      .ticket-sub {
        font-size: 13px;
        margin-bottom: 6px;
        font-weight: 500;
      }
      
      /* ផ្នែកទី២៖ ឈ្មោះផ្នែក */
      .ticket-dept-title {
        font-size: 24px;
        font-weight: 500;
        font-family: 'Khmer OS Muol Li', 'Kantumruy Pro', sans-serif;
        margin: 6px 0 2px 0;
        color: #000000;
        line-height: 1.2;
        border-bottom: 1px solid #000;
        padding-bottom: 4px;
      }
      
      /* ផ្នែកទី៣៖ ប្រអប់លេខរៀង */
      .number-box {
        border: 1px solid #000000;
        padding: 6px 0;
        margin: 8px 0;
        border-radius: 4px;
      }

      .ticket-number {
        font-size: 80px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 2px;
      }

      /* ផ្នែកទី៤៖ សារណែនាំ និង Footer */
      .ticket-instruction {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.3;
        margin-top: 4px;
      }
      .ticket-footer {
        font-size: 13px;
        border-top: 1px dashed #000;
        padding-top: 6px;
        margin-top: 8px;
        line-height: 1.3;
        font-weight: 400;
      }
    }
  </style>
</head>
<body>

  <!-- 1. អេក្រង់បង្ហាញលើ Touch Screen / Kiosk -->
  <div class="kiosk-card">
    <div class="hospital-name">
      មន្ទីរពេទ្យបង្អែកអង្គរកា
    </div>

    <div class="kiosk-title">សូមជ្រើសរើសផ្នែកដើម្បីទទួលបានលេខរៀង</div>

    <div class="dept-grid">
      <button class="btn-dept" onclick="generateAndPrintTicket('OPD', 'ពិគ្រោះជំងឺទូទៅ')">
        <span>ពិគ្រោះជំងឺទូទៅ</span>
        <span class="btn-subtext">General Consultation</span>
      </button>

      <button class="btn-dept" onclick="generateAndPrintTicket('NCD', 'ទឹកនោមផ្អែម និងលើសម្ពាធឈាម')">
        <span>ទឹកនោមផ្អែម និងលើសម្ពាធឈាម</span>
        <span class="btn-subtext">DM & HTN</span>
      </button>

      <button class="btn-dept" onclick="generateAndPrintTicket('OBGYN', 'សម្ភព និងរោគស្ត្រី')">
        <span>សម្ភព និងរោគស្ត្រី</span>
        <span class="btn-subtext">Maternity & Gynecology</span>
      </button>

      <button class="btn-dept" onclick="generateAndPrintTicket('ARV', 'OIs & ART')">
        <span>OIs & ART</span>
        <span class="btn-subtext">HIV/AIDS Care</span>
      </button>
    </div>
  </div>

  <!-- 2. ផ្ទាំងក្រដាសសំបុត្រសម្រាប់ Print -->
  <div id="print-section">
    <div class="ticket-header">មន្ទីរពេទ្យបង្អែកអង្គរកា</div>
    <div class="ticket-sub">សំបុត្រលេខរៀងពិគ្រោះ / QUEUE TICKET</div>
    
    <hr style="border: none; border-top: 1px dashed #000; margin: 6px 0;">
    
    <!-- ឈ្មោះផ្នែក -->
    <div id="print-dept-name" class="ticket-dept-title">ពិគ្រោះជំងឺទូទៅ</div>
    <div style="font-size: 14px; margin-top: 4px; font-weight: 500;">លេខរៀងរបស់អ្នក / YOUR NUMBER</div>
    
    <div class="number-box">
      <div class="ticket-number" id="print-ticket-num">001</div>
    </div>
    
    <!-- ផ្នែកណែនាំទីតាំងអគាររង់ចាំ -->
    <div id="print-instruction" class="ticket-instruction">សូមរង់ចាំការហៅលេខតាមអេក្រង់ TV</div>
    
    <div class="ticket-footer">
      <div id="print-date-time">កាលបរិច្ឆេទ: --/--/---- --:--</div>
      <div style="margin-top: 2px;">សូមអរគុណ! សូមជូនពរសុខភាពល្អ!</div>
    </div>
  </div>

  <!-- SCRIPT បញ្ជាទាញយកលេខ និង Print -->
  <script>
    let isProcessing = false;

    // មុខងារទាញយក ឬរក្សាទុកលេខរៀងក្នុង LocalStorage (001, 002, 003...)
    function getNextQueueNumber(deptKey) {
      const storageKey = `queue_count_${deptKey}`;
      let currentNum = parseInt(localStorage.getItem(storageKey)) || 0;
      currentNum += 1;
      localStorage.setItem(storageKey, currentNum);
      return String(currentNum).padStart(3, '0');
    }

    function generateAndPrintTicket(deptKey, deptNameKh) {
      if (isProcessing) return;
      isProcessing = true;

      const buttons = document.querySelectorAll('.btn-dept');
      buttons.forEach(btn => {
        btn.style.opacity = '0.5';
        btn.style.pointerEvents = 'none';
      });

      // 1. ទាញយកលេខរៀងថ្មី
      const ticketNum = getNextQueueNumber(deptKey);

      // 2. បញ្ចូលទិន្នន័យទៅក្នុងផ្ទាំង Print
      document.getElementById('print-dept-name').innerText = deptNameKh;
      document.getElementById('print-ticket-num').innerText = ticketNum;
      
      // កំណត់សារណែនាំនៅលើសំបុត្រ ទៅតាមផ្នែកនីមួយៗ
      const instructionEl = document.getElementById('print-instruction');
      if (deptKey === 'NCD') {
        instructionEl.innerText = 'សូមទៅកាន់អគារ ទឹកនោមផ្អែម និងលើសម្ពាធឈាម';
      } else if (deptKey === 'OBGYN') {
        instructionEl.innerText = 'សូមទៅកាន់អគារ សម្ភព និងរោគស្ត្រី';
      } else if (deptKey === 'ARV') {
        instructionEl.innerText = 'សូមទៅកាន់អគារ OIs & ART';
      } else {
        instructionEl.innerText = 'សូមរង់ចាំការហៅលេខតាមអេក្រង់ TV';
      }
      
      const now = new Date();
      const dateStr = now.toLocaleDateString('km-KH');
      const timeStr = now.toLocaleTimeString('km-KH');
      document.getElementById('print-date-time').innerText = `កាលបរិច្ឆេទ: ${dateStr} ${timeStr}`;

      // 3. ផ្ញើ Socket Emit (ប្រសិនបើមាន Socket Connection)
      if (typeof socket !== 'undefined' && socket && socket.connected) {
        socket.emit('take-ticket', { dept: deptKey, ticket: ticketNum });
      }

      // 4. បញ្ជាឱ្យបើកផ្ទាំង Print (Window Print)
      setTimeout(() => {
        window.print();

        setTimeout(() => {
          isProcessing = false;
          buttons.forEach(btn => {
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
          });
        }, 1000);
      }, 300);
    }
  </script>
</body>
</html>

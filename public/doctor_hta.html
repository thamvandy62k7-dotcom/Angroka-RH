<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទាំងគ្រូពេទ្យ - ប្រព័ន្ធហៅលេខ (NCD)</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');

    @font-face {
      font-family: 'Khmer OS Muol Li';
      src: local('Khmer OS Muol Light'), local('Khmer OS Muol');
    }
    @font-face {
      font-family: 'Khmer OS Battambang';
      src: local('Khmer OS Battambang');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #030816;
      color: #ffffff;
      font-family: 'Khmer OS Battambang', 'Kantumruy Pro', sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .font-muol {
      font-family: 'Khmer OS Muol Li', 'Khmer OS Muol Light', sans-serif;
    }

    /* Layout សម្រាប់បន្ទប់ពិគ្រោះតែ ១ (ចំកណ្តាលអេក្រង់) */
    .dashboard-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .card-panel {
      background-color: #081226;
      border: 1px solid #172a4d;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* ---------------- ផ្នែកក្បាល (Header) ---------------- */
    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-title h2 {
      color: #38bdf8;
      font-size: 28px;
      margin-bottom: 6px;
    }
    .header-title p {
      color: #94a3b8;
      font-size: 15px;
    }

    /* ស្ថានភាពបន្ទប់ */
    .status-badge-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
    }
    .status-online { background-color: #14532d; color: #4ade80; border: 1px solid #22c55e; }
    .status-offline { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

    /* អេក្រង់បង្ហាញលេខកំពុងហៅ */
    .display-screen {
      background-color: #040914;
      border: 2px dashed #1e3a6e;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 25px;
    }
    .screen-label {
      color: #94a3b8;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .screen-number {
      font-size: 90px;
      font-weight: bold;
      color: #f59e0b;
      letter-spacing: 4px;
      font-family: Arial, sans-serif;
      line-height: 1;
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    /* ប៊ូតុងបញ្ជា */
    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(80%);
    }

    .btn-next { background-color: #0284c7; color: white; }
    .btn-next:hover:not(:disabled) { background-color: #0369a1; }
    
    .btn-row { display: flex; gap: 12px; }
    .btn-recall { background-color: #d97706; color: white; flex: 1; }
    .btn-recall:hover:not(:disabled) { background-color: #b45309; }
    
    .btn-finish { background-color: #16a34a; color: white; flex: 1; }
    .btn-finish:hover:not(:disabled) { background-color: #15803d; }

    .btn-toggle {
      background-color: #1e293b;
      color: #cbd5e1;
      font-size: 16px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .waiting-text {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="card-panel">
      
      <!-- ក្បាលទំព័រ -->
      <div class="header-title">
        <h2 class="font-muol" id="panel-room-title">បន្ទប់ពិគ្រោះជំងឺផ្នែក ទឹកនោមផ្អែម និងលើសម្ពាធឈាម</h2>
        <p>ប្រព័ន្ធបញ្ជាហៅលេខរៀងអ្នកជំងឺ</p>
      </div>

      <!-- ស្ថានភាពបន្ទប់ -->
      <div class="status-badge-container">
        <span id="status-badge" class="status-badge status-offline">បន្ទប់កំពុងបិទ (OFFLINE)</span>
      </div>

      <!-- លេខកំពុងហៅ -->
      <div class="display-screen">
        <div class="screen-label">លេខកំពុងហៅពិគ្រោះ៖</div>
        <div class="screen-number" id="current-patient-num">---</div>
      </div>

      <!-- ប៊ូតុងបញ្ជា -->
      <div class="btn-action-group">
        <button class="btn btn-next" id="btn-next" onclick="callNextTicket()" disabled>
          📢 ហៅលេខបន្ទាប់ (CALL NEXT)
        </button>

        <div class="btn-row">
          <button class="btn btn-recall" id="btn-recall" onclick="recallTicket()" disabled>
            🔔 ហៅម្តងទៀត
          </button>
          <button class="btn btn-finish" id="btn-finish" onclick="completeTicket()" disabled>
            ✅ បញ្ចប់ការពិគ្រោះ
          </button>
        </div>

        <button class="btn btn-toggle" id="toggle-status-btn" onclick="toggleRoomStatus()">
          🟢 បើកដំណើរការបន្ទប់នេះ (ONLINE)
        </button>
      </div>

      <!-- ចំនួនអ្នករង់ចាំ -->
      <div class="waiting-text">
        ចំនួនអ្នកជំងឺកំពុងរង់ចាំសរុប៖ <b id="waiting-count" style="color: #facc15; font-size: 20px;">0</b> នាក់
      </div>

    </div>
  </div>

  <!-- Realtime Socket Logic -->
  <script>
    const socket = io();

    const currentDept = 'NCD';
    const roomNum = 1;
    let isRoomOnline = false;

    function requestInitData() {
      socket.emit('get-doctor-init', { dept: currentDept, room: roomNum });
    }

    socket.on('connect', () => {
      requestInitData();
    });

    socket.on('update-rooms', (rooms) => {
      const deptRooms = rooms[currentDept] || {};
      const rData = deptRooms[roomNum] || deptRooms || { currentTicket: '---', status: 'OFFLINE' };
      
      const numElem = document.getElementById('current-patient-num');
      const statusBadge = document.getElementById('status-badge');
      const toggleBtn = document.getElementById('toggle-status-btn');

      const btnNext = document.getElementById('btn-next');
      const btnRecall = document.getElementById('btn-recall');
      const btnFinish = document.getElementById('btn-finish');

      numElem.innerText = rData.currentTicket || '---';

      if (rData.status === 'ACTIVE' || rData.status === 'ONLINE') {
        isRoomOnline = true;
        statusBadge.className = 'status-badge status-online';
        statusBadge.innerText = 'បន្ទប់កំពុងដំណើរការ (ONLINE)';
        toggleBtn.innerText = '🔴 បិទបន្ទប់នេះ (OFFLINE)';
        toggleBtn.style.backgroundColor = '#7f1d1d';

        btnNext.disabled = false;
        btnRecall.disabled = false;
        btnFinish.disabled = false;
      } else {
        isRoomOnline = false;
        statusBadge.className = 'status-badge status-offline';
        statusBadge.innerText = 'បន្ទប់កំពុងបិទ (OFFLINE)';
        toggleBtn.innerText = '🟢 បើកដំណើរការបន្ទប់នេះ (ONLINE)';
        toggleBtn.style.backgroundColor = '#14532d';

        btnNext.disabled = true;
        btnRecall.disabled = true;
        btnFinish.disabled = true;
      }
    });

    socket.on('update-waiting', (waitingLists) => {
      const waitingElem = document.getElementById('waiting-count');
      if (waitingElem) {
        const list = waitingLists[currentDept] || [];
        waitingElem.innerText = list.length;
      }
    });

    function callNextTicket() {
      if (!isRoomOnline) return;
      socket.emit('call-next', { dept: currentDept, room: roomNum });
    }

    function recallTicket() {
      if (!isRoomOnline) return;
      socket.emit('recall-ticket', { dept: currentDept, room: roomNum });
    }

    function completeTicket() {
      if (!isRoomOnline) return;
      socket.emit('complete-ticket', { dept: currentDept, room: roomNum });
    }

    function toggleRoomStatus() {
      socket.emit('toggle-room-status', { dept: currentDept, room: roomNum });
    }
  </script>
</body>
</html>
